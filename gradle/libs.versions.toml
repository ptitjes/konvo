[versions]

projectVersion = "1.0.0"

kotlin = "2.3.20"
kotlinxDatetime = "0.7.1"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.10.2"
kotlinxIo = "0.9.0"
kotlinxBenchmark = "0.4.16"
kotlinxKover = "0.9.8"
kotlinDokka = "2.2.0"
ktor = "3.4.2"

kotlinLogging = "8.0.01"
slf4j = "2.0.17"

testBalloon = "0.8.4-K2.3.20"

# Plugin System
syrup = "0.1.1"
ksp = "2.3.6"
sweetSpi = "0.1.3"
kodein = "7.31.0"

koog = "0.8.0"
mcp = "0.11.0"
kotlinxSchema = "0.5.0"
uriKmp = "0.0.21"
kim = "0.28.0"

opentelemetry = "1.61.0"

# Compose Frontend

compose = "1.12.0"
composeMaterial3 = "1.11.0-alpha06"
composeMaterial3Adaptive = "1.3.0-alpha06"
androidxLifecycle = "2.11.0-alpha03"
androidxNavigation3 = "1.1.0-rc01"

circuit = "0.33.1"

humanReadable = "1.12.3"

markdownRenderer = "0.40.2"
fileKit = "0.13.0"
coil = "3.4.0"
reorderable = "3.0.0"
placeholder = "1.0.12"

# For tools
shadow = "9.4.1"
kotlinxCli = "0.3.6"
ksoup = "0.2.6"
flexmark = "0.64.8"

[libraries]
kotlinxDatetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinxSerialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinxCoroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }
kotlinxIoCore = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }
kotlinxIoOkio = { module = "org.jetbrains.kotlinx:kotlinx-io-okio", version.ref = "kotlinxIo" }

ktorClientContentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktorSerializationKotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktorClientCore = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktorClientLogging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktorClientCio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }

ktorServerCio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }

kotlinLogging = { module = "io.github.oshai:kotlin-logging", version.ref = "kotlinLogging" }
slf4jSimple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

testBalloonFrameworkCore = { module = "de.infix.testBalloon:testBalloon-framework-core", version.ref = "testBalloon" }

# Plugin System
syrupRuntime = { module = "io.github.ptitjes:syrup-runtime", version.ref = "syrup" }
syrupHost = { module = "io.github.ptitjes:syrup-host", version.ref = "syrup" }

koog = { module = "ai.koog:koog-agents", version.ref = "koog" }
koogPromptMarkdown = { module = "ai.koog:prompt-markdown", version.ref = "koog" }
mcp = { module = "io.modelcontextprotocol:kotlin-sdk", version.ref = "mcp" }
kotlinxSchemaKsp = { module = "org.jetbrains.kotlinx:kotlinx-schema-ksp", version.ref = "kotlinxSchema" }
kotlinxSchemaAnnotations = { module = "org.jetbrains.kotlinx:kotlinx-schema-annotations", version.ref = "kotlinxSchema" }
kotlinxSchemaGeneratorJson = { module = "org.jetbrains.kotlinx:kotlinx-schema-generator-json", version.ref = "kotlinxSchema" }
uriKmp = { module = "com.eygraber:uri-kmp", version.ref = "uriKmp" }
kim = { module = "de.stefan-oltmann:kim", version.ref = "kim" }

opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
opentelemetry-exporter-logging = { module = "io.opentelemetry:opentelemetry-exporter-logging" }

# Compose Frontend

composeUiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose" }
composeUiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose" }
composeUiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose" }
composeComponentsResources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
composeMaterial3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
composeMaterial3AdaptiveNavigationSuite = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "composeMaterial3" }
composeMaterial3Adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "composeMaterial3Adaptive" }

androidxLifecycleViewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidxLifecycleViewmodelNavigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidxLifecycle" }
androidxNavigation3Ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "androidxNavigation3" }

kodeinCompose = { module = "org.kodein.di:kodein-di-framework-compose", version.ref = "kodein" }

circuit = { module = "com.slack.circuit:circuit-foundation", version.ref = "circuit" }

humanReadable = { module = "nl.jacobras:Human-Readable", version.ref = "humanReadable" }

markdownRenderer = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
markdownRendererCoil = { module = "com.mikepenz:multiplatform-markdown-renderer-coil3", version.ref = "markdownRenderer" }
markdownRendererCode = { module = "com.mikepenz:multiplatform-markdown-renderer-code", version.ref = "markdownRenderer" }
fileKitCore = { module = "io.github.vinceglb:filekit-core", version.ref = "fileKit" }
fileKitDialogs = { module = "io.github.vinceglb:filekit-dialogs", version.ref = "fileKit" }
fileKitDialogsCompose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "fileKit" }
fileKitCoil = { module = "io.github.vinceglb:filekit-coil", version.ref = "fileKit" }
coil = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coilKtor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
placeholder = { module = "com.eygraber:compose-placeholder-material3", version.ref = "placeholder" }

# For tools
kotlinxCli = { module = "org.jetbrains.kotlinx:kotlinx-cli", version.ref = "kotlinxCli" }
slf4jNop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
ksoup = { module = "com.fleeksoft.ksoup:ksoup-kotlinx", version.ref = "ksoup" }
flexmarkHtmlMarkdownConverter = { module = "com.vladsch.flexmark:flexmark-html2md-converter", version.ref = "flexmark" }

[bundles]
kotlinxEcosystem = ["kotlinxDatetime", "kotlinxSerialization", "kotlinxCoroutines", "kotlinxIoCore"]
ktorClient = ["ktorClientCore", "ktorClientLogging", "ktorClientContentNegotiation", "ktorSerializationKotlinxJson"]

composeUi = ["composeUiTooling", "composeUiToolingPreview", "composeComponentsResources", "composeMaterial3", "composeMaterial3Adaptive", "composeMaterial3AdaptiveNavigationSuite", "androidxLifecycleViewmodelCompose", "androidxLifecycleViewmodelNavigation3", "androidxNavigation3Ui"]
fileKit = ["fileKitCore", "fileKitDialogs", "fileKitDialogsCompose", "fileKitCoil"]

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinPluginSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

kotlinBenchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinxBenchmark" }
kotlinKover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kotlinxKover" }
kotlinDokka = { id = "org.jetbrains.dokka", version.ref = "kotlinDokka" }

testBalloon = { id = "de.infix.testBalloon", version.ref = "testBalloon" }

# Plugin System
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
sweetSpi = { id = "dev.whyoleg.sweetspi", version.ref = "sweetSpi" }

# Compose Frontend
kotlinPluginCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }

# For tools
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
